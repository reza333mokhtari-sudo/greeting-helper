name: Desktop Qt CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build and Test (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.*'
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          modules: 'qtquickcontrols2 qtdeclarative'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake ../desktop/qt -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Run Smoke Tests
        run: |
          echo "Executing automated smoke tests for Dungeon Editor..."
          # In a real environment, we would run CTest or a headless QML test
          # For this CI setup, we verify the binary exists and has required links
          if [ -f build/DungeonEditorNative ]; then
            echo "Build successful: DungeonEditorNative binary created."
            ldd build/DungeonEditorNative
          else
            echo "Build failed: binary not found."
            exit 1
          fi
