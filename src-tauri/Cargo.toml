[package]
name = "dungeonscrawl"
version = "0.1.0"
description = "A professional 2D dungeon map maker"
authors = ["Lovable"]
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.6", features = ["shell-open"] }

[features]
# by default Tauri runs in production mode
# when `tauri dev` is run, it is executed with `custom-protocol` feature
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
