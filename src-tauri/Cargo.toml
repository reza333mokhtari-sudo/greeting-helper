[package]
name = "dungeonscrawl"
version = "0.1.0"
description = "A professional 2D dungeon map maker"
authors = ["Lovable"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[features]
default = []
